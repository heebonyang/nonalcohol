<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>생활 관리</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f3f4f6; min-height: 100vh; color: #1f2937;
            /* 하단 홈 인디케이터 영역 확보 */
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* ── 메인 탭 ── */
        .main-nav {
            display: flex; background: white; position: sticky; top: 0; z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            /* 상단 노치/Dynamic Island 영역 확보 */
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        .main-tab {
            flex: 1; padding: 16px; border: none; background: transparent;
            font-size: 1rem; font-weight: 700; color: #6b7280; cursor: pointer;
            border-bottom: 3px solid transparent; transition: all 0.2s;
            font-family: inherit;
        }
        .main-tab:hover { background: #f9fafb; color: #1f2937; }
        .main-tab.active { color: #0284c7; border-bottom-color: #0284c7; background: #f0f9ff; }
        .app-section { display: none; }
        .app-section.active { display: block; }

        /* ══ 금주 앱 CSS ══ */
        #app-jk { padding: 30px 20px; }
        #app-jk .container { max-width: 1000px; margin: auto; }
        #app-jk .header-card {
            background: #fff; padding: 30px; border-radius: 20px;
            text-align: center; margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        #app-jk .sub-title { font-size: 1.2rem; color: #6b7280; font-weight: 600; margin-bottom: 10px; }
        #app-jk .main-streak { font-size: 4rem; font-weight: 800; color: #0284c7; display: block; }
        #app-jk .streak-unit { font-size: 1.5rem; color: #1f2937; vertical-align: middle; }
        #app-jk .total-sober { margin-top: 14px; font-size: 1rem; color: #4b5563; }
        #app-jk .total-sober b { color: #059669; font-size: 1.25rem; }
        #app-jk .total-sober small { display: block; margin-top: 4px; font-size: 0.8rem; color: #9ca3af; }
        #app-jk .input-card {
            background: #fff; padding: 25px; border-radius: 20px;
            margin-bottom: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        #app-jk .form-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
        #app-jk input, #app-jk select {
            border: 1px solid #d1d5db; padding: 12px 15px;
            border-radius: 10px; font-size: 0.95rem; outline: none; font-family: inherit;
        }
        #app-jk .reason-container { width: 100%; display: none; margin-top: 15px; }
        #app-jk .reason-input { width: 100%; border: 2px solid #fecaca !important; background: #fff1f2 !important; }
        #app-jk .btn-save {
            background: #0284c7; color: white; border: none;
            padding: 12px 35px; border-radius: 10px; font-weight: 700;
            cursor: pointer; font-family: inherit;
        }
        #app-jk .btn-save.edit-mode { background: #f59e0b; }
        #app-jk .table-card {
            background: #fff; border-radius: 20px; overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        #app-jk table { width: 100%; border-collapse: collapse; }
        #app-jk th {
            background: #f9fafb; padding: 15px; color: #4b5563;
            font-size: 0.85rem; border-bottom: 1px solid #e5e7eb;
        }
        #app-jk td { padding: 18px 15px; border-bottom: 1px solid #f3f4f6; text-align: center; }
        #app-jk .status-o { color: #059669; font-weight: 800; }
        #app-jk .status-x { color: #dc2626; font-weight: 800; }
        #app-jk .reason-label { font-size: 0.8rem; color: #ef4444; display: block; margin-top: 5px; font-style: italic; }
        #app-jk .btn-edit {
            background: #e5e7eb; color: #374151; border: none;
            padding: 6px 12px; border-radius: 6px; cursor: pointer;
            margin-right: 5px; font-family: inherit;
        }
        #app-jk .btn-del {
            background: #fee2e2; color: #b91c1c; border: none;
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: inherit;
        }

        /* ══ 금주 마일스톤 CSS ══ */
        #app-jk .milestone-bar {
            display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
        }
        #app-jk .milestone-chip {
            flex: 1; min-width: 120px;
            background: white; border-radius: 12px;
            padding: 10px 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.07);
            display: flex; align-items: center; gap: 10px;
        }
        #app-jk .milestone-chip.done {
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: white;
        }
        #app-jk .milestone-chip.done .mc-label,
        #app-jk .milestone-chip.done .mc-date { color: rgba(255,255,255,0.9); }
        #app-jk .mc-icon { font-size: 1.4rem; flex-shrink: 0; }
        #app-jk .mc-label { font-size: 0.72rem; color: #6b7280; font-weight: 600; margin-bottom: 2px; }
        #app-jk .mc-date  { font-size: 0.82rem; font-weight: 700; color: #1f2937; }
        #app-jk .mc-dday  { font-size: 0.7rem; font-weight: 700; margin-top: 1px; }
        #app-jk .mc-dday.soon   { color: #f59e0b; }
        #app-jk .mc-dday.future { color: #9ca3af; }
        #app-jk .mc-dday.done   { color: rgba(255,255,255,0.85); }

        /* ══ 가계부 앱 CSS ══ */
        #app-gk { padding: 16px; }
        #app-gk .container { max-width: 600px; margin: 0 auto; }
        #app-gk .gk-tabs { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
        #app-gk .gk-tab {
            padding: 8px 18px; border-radius: 999px; border: none; cursor: pointer;
            font-size: 0.83rem; font-weight: 600; white-space: nowrap;
            transition: background 0.2s; font-family: inherit;
        }
        #app-gk .gk-tab.active { background: #5a67d8; color: white; }
        #app-gk .gk-tab:not(.active) { background: white; color: #4a5568; }
        #app-gk .gk-tab:not(.active):hover { background: #e2e8f0; }
        #app-gk .card {
            background: white; border-radius: 14px; padding: 18px;
            margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        #app-gk .card h2 { font-size: 0.95rem; color: #4a5568; margin-bottom: 14px; font-weight: 700; }
        #app-gk .form-group { margin-bottom: 12px; }
        #app-gk .form-group label { display: block; font-size: 0.75rem; color: #718096; margin-bottom: 5px; font-weight: 600; }
        #app-gk .form-group input, #app-gk .form-group select {
            width: 100%; padding: 10px 12px; border: 1.5px solid #e2e8f0;
            border-radius: 8px; font-size: 0.92rem; background: white; font-family: inherit;
        }
        #app-gk .form-group input:focus, #app-gk .form-group select:focus {
            outline: none; border-color: #5a67d8;
        }
        #app-gk .gk-row { display: flex; gap: 10px; }
        #app-gk .gk-row .form-group { flex: 1; min-width: 0; }
        #app-gk .btn {
            padding: 11px 18px; border: none; border-radius: 9px; cursor: pointer;
            font-size: 0.9rem; font-weight: 700; width: 100%;
            transition: opacity 0.2s; font-family: inherit;
        }
        #app-gk .btn:hover { opacity: 0.88; }
        #app-gk .btn-primary { background: #5a67d8; color: white; }
        #app-gk .btn-sm {
            font-size: 0.72rem; padding: 4px 10px; width: auto; border-radius: 999px;
            background: #fed7d7; color: #c53030; border: none; cursor: pointer;
            font-weight: 600; font-family: inherit;
        }
        #app-gk .btn-sm:hover { background: #fc8181; color: white; }
        #app-gk .btn-sm-edit {
            font-size: 0.72rem; padding: 4px 10px; width: auto; border-radius: 999px;
            background: #bee3f8; color: #2b6cb0; border: none; cursor: pointer;
            font-weight: 600; font-family: inherit;
        }
        #app-gk .btn-sm-edit:hover { background: #63b3ed; color: white; }
        #app-gk .btn-sm-confirm {
            font-size: 0.72rem; padding: 4px 10px; width: auto; border-radius: 999px;
            background: #c6f6d5; color: #276749; border: none; cursor: pointer;
            font-weight: 600; font-family: inherit;
        }
        #app-gk .btn-sm-confirm:hover { background: #48bb78; color: white; }
        #app-gk .btn-sm-unconfirm {
            font-size: 0.72rem; padding: 4px 10px; width: auto; border-radius: 999px;
            background: #e2e8f0; color: #718096; border: none; cursor: pointer;
            font-weight: 600; font-family: inherit;
        }
        #app-gk .btn-sm-unconfirm:hover { background: #a0aec0; color: white; }
        #app-gk .list-item { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid #f0f4f8; }
        #app-gk .list-item:last-child { border-bottom: none; }
        #app-gk .list-item .info .name { font-weight: 600; font-size: 0.92rem; }
        #app-gk .list-item .info .sub { font-size: 0.77rem; color: #a0aec0; margin-top: 2px; }
        #app-gk .list-item .right { display: flex; align-items: center; gap: 10px; }
        #app-gk .list-item .amount { font-weight: 700; color: #e53e3e; font-size: 0.95rem; }
        #app-gk .empty { text-align: center; color: #a0aec0; padding: 20px; font-size: 0.87rem; }
        #app-gk .divider { height: 1px; background: #f0f4f8; margin: 10px 0; }

        /* ══ 생활비 CSS ══ */
        #app-gk .lv-hero {
            background: linear-gradient(135deg, #5a67d8 0%, #764ba2 100%);
            border-radius: 20px; padding: 18px 20px 20px; color: #fff;
            margin-bottom: 14px; box-shadow: 0 8px 24px rgba(90,103,216,0.3);
        }
        #app-gk .lv-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        #app-gk .lv-nav button {
            background: rgba(255,255,255,0.18); color: #fff; border: none; border-radius: 999px;
            width: 32px; height: 32px; font-size: 1.1rem; cursor: pointer; font-family: inherit;
        }
        #app-gk .lv-nav button:disabled { opacity: 0.3; cursor: default; }
        #app-gk .lv-nav-title { font-weight: 800; font-size: 0.98rem; }
        #app-gk .lv-label { font-size: 0.78rem; opacity: 0.85; display: flex; justify-content: space-between; align-items: center; }
        #app-gk .lv-goal-btn {
            background: rgba(255,255,255,0.18); color: #fff; border: none; border-radius: 999px;
            padding: 3px 10px; font-size: 0.7rem; font-weight: 600; cursor: pointer; font-family: inherit;
        }
        #app-gk .lv-spent { font-size: 2.2rem; font-weight: 800; line-height: 1.15; margin-top: 4px; letter-spacing: -0.02em; }
        #app-gk .lv-spent small { font-size: 0.9rem; font-weight: 600; opacity: 0.75; margin-left: 4px; }
        #app-gk .lv-bar { position: relative; height: 12px; background: rgba(255,255,255,0.22); border-radius: 999px; margin: 14px 0 6px; overflow: hidden; }
        #app-gk .lv-bar-fill { height: 100%; border-radius: 999px; transition: width 0.4s, background 0.4s; }
        #app-gk .lv-bar-pace { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #fff; opacity: 0.9; }
        #app-gk .lv-bar-legend { display: flex; justify-content: space-between; font-size: 0.68rem; opacity: 0.75; }
        #app-gk .lv-status { margin-top: 12px; background: rgba(255,255,255,0.16); border-radius: 12px; padding: 10px 12px; font-size: 0.84rem; font-weight: 600; }
        #app-gk .lv-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        #app-gk .lv-stat { background: rgba(0,0,0,0.16); border-radius: 12px; padding: 10px 8px; text-align: center; }
        #app-gk .lv-stat-label { font-size: 0.68rem; opacity: 0.8; margin-bottom: 3px; }
        #app-gk .lv-stat-value { font-size: 0.95rem; font-weight: 800; }
        #app-gk .lv-fixed-note { font-size: 0.74rem; color: #718096; background: #f7fafc; border-radius: 10px; padding: 9px 12px; margin-bottom: 14px; }
        #app-gk .lv-cats { display: flex; flex-wrap: wrap; gap: 6px; }
        #app-gk .lv-cat {
            border: 1.5px solid #e2e8f0; background: #fff; color: #4a5568; border-radius: 999px;
            padding: 6px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: inherit;
        }
        #app-gk .lv-cat.active { border-color: #5a67d8; background: #ebf4ff; color: #434190; }
        #app-gk .lv-cat-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        #app-gk .lv-cat-title { font-size: 0.75rem; color: #718096; font-weight: 600; }
        #app-gk .lv-cat-edit-toggle {
            display: inline-flex; align-items: center; gap: 4px;
            background: #ebf4ff; border: none; color: #4c51bf; border-radius: 999px;
            padding: 5px 12px; font-size: 0.74rem; font-weight: 700;
            cursor: pointer; font-family: inherit;
        }
        #app-gk .lv-cat-edit-toggle:hover { background: #c3dafe; }
        #app-gk .lv-cat-edit-toggle.on { background: #5a67d8; color: #fff; }
        #app-gk .lv-cats.editing {
            background: #f7fafc; border: 1.5px dashed #c3dafe; border-radius: 12px; padding: 10px;
        }
        #app-gk .lv-cats.editing .lv-cat { cursor: default; }
        #app-gk .lv-cat-x {
            margin-left: 6px; color: #e53e3e; font-weight: 800; cursor: pointer;
            background: none; border: none; padding: 0; font-size: 0.85rem; font-family: inherit;
        }
        #app-gk .lv-cat-rename { background: none; border: none; padding: 0; color: inherit; font: inherit; cursor: pointer; }
        #app-gk .lv-cat-add { border-style: dashed; color: #5a67d8; }
        #app-gk .lv-cat-hint { font-size: 0.72rem; color: #a0aec0; margin-top: 6px; }
        #app-gk .lv-breakdown-row { margin-bottom: 9px; }
        #app-gk .lv-breakdown-row:last-child { margin-bottom: 0; }
        #app-gk .lv-breakdown-head { display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 4px; }
        #app-gk .lv-breakdown-head span:last-child { font-weight: 700; color: #2d3748; }
        #app-gk .lv-breakdown-bar { height: 6px; background: #edf2f7; border-radius: 999px; overflow: hidden; }
        #app-gk .lv-breakdown-bar div { height: 100%; background: #7f9cf5; border-radius: 999px; }
        #app-gk .lv-day-head { display: flex; justify-content: space-between; font-size: 0.76rem; font-weight: 700; color: #718096; padding: 12px 0 2px; border-bottom: 1px solid #edf2f7; }
        #app-gk .lv-day-head:first-child { padding-top: 0; }

        /* ══ 구독 관리 CSS ══ */
        #app-gk .sub-badge {
            font-size: 0.65rem; padding: 2px 6px; border-radius: 999px;
            font-weight: 600; vertical-align: middle; margin-left: 3px;
        }
        #app-gk .sub-badge-monthly { background: #ebf4ff; color: #2b6cb0; }
        #app-gk .sub-badge-yearly  { background: #fefcbf; color: #744210; }
        #app-gk .sub-toggle { position: relative; display: inline-block; width: 36px; height: 20px; cursor: pointer; flex-shrink: 0; }
        #app-gk .sub-toggle input { opacity: 0; width: 0; height: 0; }
        #app-gk .sub-toggle-slider {
            position: absolute; inset: 0; background: #e2e8f0;
            border-radius: 999px; transition: 0.2s;
        }
        #app-gk .sub-toggle-slider:before {
            content: ''; position: absolute; width: 14px; height: 14px;
            background: white; border-radius: 50%; top: 3px; left: 3px; transition: 0.2s;
        }
        #app-gk .sub-toggle input:checked + .sub-toggle-slider { background: #5a67d8; }
        #app-gk .sub-toggle input:checked + .sub-toggle-slider:before { transform: translateX(16px); }
        #app-gk .sub-inactive { opacity: 0.4; }
        #app-gk .sub-next-date { font-size: 0.72rem; color: #a0aec0; margin-top: 2px; }
        #app-gk .sub-next-date.soon { color: #e53e3e; font-weight: 600; }
        #app-gk .sub-item-inner { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }

        /* ══ 대출 관리 CSS ══ */
        #app-gk .loan-card {
            background: #fff8f8; border: 1.5px solid #fed7d7;
            border-radius: 12px; padding: 14px; margin-bottom: 10px;
        }
        #app-gk .loan-card:last-child { margin-bottom: 0; }
        #app-gk .loan-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        #app-gk .loan-card-name { font-size: 0.95rem; font-weight: 700; color: #2d3748; }
        #app-gk .loan-card-memo { font-size: 0.72rem; color: #a0aec0; margin-top: 2px; }
        #app-gk .loan-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
        #app-gk .loan-meta-item { background: white; border-radius: 8px; padding: 8px 10px; }
        #app-gk .loan-meta-label { font-size: 0.68rem; color: #718096; margin-bottom: 2px; }
        #app-gk .loan-meta-value { font-size: 0.88rem; font-weight: 700; color: #2d3748; }
        #app-gk .loan-next-pay { font-size: 0.77rem; color: #c53030; font-weight: 600; margin-bottom: 10px; }
        #app-gk .loan-next-pay.far { color: #718096; font-weight: 400; }
        #app-gk .btn-schedule-pay { background: #ebf8ff; color: #2b6cb0; border: none; border-radius: 6px; padding: 3px 8px; font-size: 0.72rem; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
        #app-gk .btn-schedule-pay:hover { background: #bee3f8; }
        /* ══ 대출 계산 미리보기 CSS ══ */
        #app-gk .loan-calc-preview {
            background: #f0fff4; border: 1.5px solid #9ae6b4;
            border-radius: 10px; padding: 12px 14px; margin: 10px 0;
        }
        #app-gk .loan-preview-title { font-size: 0.8rem; font-weight: 700; color: #276749; margin-bottom: 8px; }
        #app-gk .loan-preview-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.8rem; padding: 3px 0; border-bottom: 1px solid #c6f6d5;
        }
        #app-gk .loan-preview-row:last-child { border-bottom: none; }
        #app-gk .loan-preview-label { color: #4a5568; }
        #app-gk .loan-preview-val { font-weight: 700; color: #2d3748; }
        #app-gk .loan-preview-val.red { color: #e53e3e; }
        #app-gk .loan-preview-sub { font-size: 0.72rem; color: #718096; }
        /* ══ 상환 일정 CSS ══ */
        #app-gk .loan-repay-badge {
            font-size: 0.67rem; padding: 2px 7px; border-radius: 999px;
            font-weight: 600; background: #fef3c7; color: #92400e; margin-left: 5px;
            vertical-align: middle;
        }
        #app-gk .loan-schedule-list { display: flex; flex-direction: column; gap: 6px; }
        #app-gk .loan-overdue {font-size: 0.68em; color: #c53030; background: #fff5f5; border: 1px solid #fed7d7; border-radius: 3px; padding: 1px 5px; margin-left: 3px; font-weight: 600; vertical-align: middle; }

        /* ══ 모바일 반응형 ══ */
        @media (max-width: 600px) {
            /* 탭: 좌우 safe-area 패딩 포함 */
            .main-tab {
                padding: 13px 8px; font-size: 0.88rem;
            }

            /* 금주 앱 */
            #app-jk {
                padding: 14px 12px;
                padding-left: max(12px, env(safe-area-inset-left));
                padding-right: max(12px, env(safe-area-inset-right));
                overflow-x: hidden;
            }
            #app-jk .container { width: 100%; }
            /* 마일스톤 칩 min-width 해제 → 3개가 화면을 넘치는 원인 */
            #app-jk .milestone-chip { min-width: 0; }
            #app-jk .header-card { padding: 20px 16px; margin-bottom: 14px; }
            #app-jk .sub-title { font-size: 1rem; }
            #app-jk .main-streak { font-size: 3rem; }
            #app-jk .streak-unit { font-size: 1.2rem; }
            #app-jk .input-card { padding: 16px 14px; margin-bottom: 14px; overflow: hidden; }

            /* 폼: 2열 그리드로 전환 */
            #app-jk .form-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                overflow: hidden;
            }
            /* 날짜·저장 버튼은 전체 너비 */
            #app-jk #targetDate { grid-column: 1 / -1; width: 100%; }
            #app-jk .btn-save {
                grid-column: 1 / -1; width: 100%;
                padding: 14px; font-size: 1rem;
            }
            /* iOS Safari 자동 줌 방지 + 그리드 셀 넘침 방지 */
            #app-jk input, #app-jk select { font-size: 16px; width: 100%; min-width: 0; }

            /* 테이블: 가로 스크롤 */

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
    apiKey: "AIzaSyCE7iN5FD2d8HegeNx0BQt6Af935k4_yjI",
    authDomain: "nonalcohol-f1fe7.firebaseapp.com",
    projectId: "nonalcohol-f1fe7",
    storageBucket: "nonalcohol-f1fe7.firebasestorage.app",
    messagingSenderId: "429464917450",
    appId: "1:429464917450:web:a6304e8624a5a336bfeb33"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ── 공통 유틸 ──
function todayStr() {
    const t = new Date();
    return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
}
function fmtDate(d) {
    const dt = (typeof d === 'string') ? new Date(d) : d;
    return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
}
function pad(n) { return String(n).padStart(2, '0'); }
function fmtMoney(n) { return Math.round(n).toLocaleString('ko-KR') + '원'; }
function fmtYearMonth(dateStr) {
    if (!dateStr) return '-';
    const d = new Date(dateStr);
    return `${d.getFullYear()}년 ${d.getMonth()+1}월`;
}
function monthDiff(from, to) {
    const diff = (to.getFullYear() - from.getFullYear()) * 12 + (to.getMonth() - from.getMonth());
    return Math.max(0, diff);
}
function fmtMonthDay(d) { return `${d.getMonth()+1}월 ${d.getDate()}일`; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function escHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── 탭 전환 ──
function switchApp(name, btn) {
    document.querySelectorAll('.app-section').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.main-tab').forEach(el => el.classList.remove('active'));
    document.getElementById('app-' + name).classList.add('active');
    btn.classList.add('active');
}
window.switchApp = switchApp;

// ═══════════════════════════════════
// ── 금주 앱 (jk) ──
// ═══════════════════════════════════
const JK_DOC_REF = doc(db, 'challenge', 'main');
let D_jk = { records: [] };

// 누적 금주 카운트 시작일 (연속이 끊겨도 누적됨)
const JK_TOTAL_START = '2026-11-04';

function getTotalSober(records) {
    const inRange = records.filter(r => r.date >= JK_TOTAL_START);
    return {
        sober: inRange.filter(r => r.sober === 'O').length,
        recorded: inRange.length
    };
}

function getCurrentStreak(records) {
    const sorted = [...records].sort((a, b) => b.date.localeCompare(a.date));
    let streak = 0;
    for (const r of sorted) {
        if (r.sober === 'O') streak++;
        else break;
    }
    return streak;
}

async function jk_load() {
    try {
        const snap = await getDoc(JK_DOC_REF);
        if (snap.exists()) D_jk = { records: [], ...snap.data() };
    } catch (e) {
        console.error('금주 로드 실패:', e);
    }
    jk_renderTable();
}

function jk_save() {
    setDoc(JK_DOC_REF, D_jk).catch(err => console.error('금주 저장 실패:', err));
}

function jk_updateSoberCounter() {
    const streak = getCurrentStreak(D_jk.records);
    const countElem = document.getElementById('day-count');
    const textElem  = document.getElementById('streak-text');
    countElem.innerText = streak;
    if (streak === 0) {
        countElem.style.color = '#dc2626';
        textElem.innerText = '일차 - 다시 시작해봐요!';
    } else {
        countElem.style.color = '#0284c7';
        textElem.innerText = '일차 금주 중';
    }
    const total = getTotalSober(D_jk.records);
    const totalElem = document.getElementById('jk-total');
    if (totalElem) {
        totalElem.innerHTML = `누적 금주 <b>${total.sober}</b>일` +
            `<small>${JK_TOTAL_START.replace(/-/g, '.')}부터 · 기록한 ${total.recorded}일 중</small>`;
    }
    jk_renderMilestones(streak);
}

function jk_renderMilestones(streak) {
    const el = document.getElementById('jk-milestones');
    if (!el) return;

    // 현재 연속 스트릭의 시작일 계산
    const sorted = [...D_jk.records].sort((a, b) => b.date.localeCompare(a.date));
    let startDate = null;
    if (streak > 0) {
        // 가장 오래된 연속 O 기록 찾기
        let count = 0;
        for (const r of sorted) {
            if (r.sober === 'O') count++;
            else break;
        }
        // count번째 기록의 날짜가 연속 시작일
        const startRecord = sorted[count - 1];
        startDate = startRecord ? new Date(startRecord.date) : null;
    }

    const MILESTONES = [
        { day: 30,  icon: '🌱', label: '30일' },
        { day: 50,  icon: '⭐', label: '50일' },
        { day: 100, icon: '🏆', label: '100일' },
    ];

    const today = new Date(); today.setHours(0,0,0,0);

    el.innerHTML = MILESTONES.map(m => {
        const isDone = streak >= m.day;

        let dateStr = '-';
        let ddayHtml = '';

        if (startDate) {
            // 목표 달성일 = 시작일 + (m.day - 1)일
            const targetDate = new Date(startDate);
            targetDate.setDate(targetDate.getDate() + m.day - 1);
            const yyyy = targetDate.getFullYear();
            const mm   = String(targetDate.getMonth() + 1).padStart(2, '0');
            const dd   = String(targetDate.getDate()).padStart(2, '0');
            dateStr = `${yyyy}.${mm}.${dd}`;

            if (isDone) {
                ddayHtml = `<div class="mc-dday done">달성 완료 🎉</div>`;
            } else {
                const daysLeft = Math.ceil((targetDate - today) / 86400000);
                if (daysLeft <= 7) {
                    ddayHtml = `<div class="mc-dday soon">D-${daysLeft} 🔥</div>`;
                } else {
                    ddayHtml = `<div class="mc-dday future">D-${daysLeft}</div>`;
                }
            }
        } else {
            dateStr = '기록 없음';
        }

        return `<div class="milestone-chip${isDone ? ' done' : ''}">
            <div class="mc-icon">${m.icon}</div>
            <div>
                <div class="mc-label">${m.label} 달성 예정</div>
                <div class="mc-date">${dateStr}</div>
                ${ddayHtml}
            </div>
        </div>`;
    }).join('');
}

function jk_renderTable() {
    const tbody = document.getElementById('data-list');
    tbody.innerHTML = '';
    const sorted = [...D_jk.records].sort((a, b) => b.date.localeCompare(a.date));
    sorted.forEach(r => {
        const reasonHtml = r.reason ? `<span class="reason-label">사유: ${escHtml(r.reason)}</span>` : '';
        const safeDate     = escHtml(r.date);
        const safeSober    = escHtml(r.sober);
        const safeExercise = escHtml(r.exercise);
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td style="font-weight:600;color:#4b5563;">${safeDate}</td>
            <td><span class="${r.sober === 'O' ? 'status-o' : 'status-x'}">${safeSober}</span>${reasonHtml}</td>
            <td class="${r.exercise === 'O' ? 'status-o' : 'status-x'}">${safeExercise}</td>
            <td>
                <button class="btn-edit" onclick="jk_editItem('${safeDate}')">수정</button>
                <button class="btn-del"  onclick="jk_deleteRecord('${safeDate}')">삭제</button>
            </td>`;
        tbody.appendChild(tr);
    });
    jk_updateSoberCounter();
}

function jk_toggleReason() {
    const isX = document.getElementById('sober').value === 'X';
    document.getElementById('reason-container').style.display = isX ? 'block' : 'none';
    if (!isX) document.getElementById('reason').value = '';
}

function jk_resetInputs() {
    document.getElementById('sober').value    = 'O';
    document.getElementById('exercise').value = 'O';
    document.getElementById('reason').value   = '';
    jk_toggleReason();

        D_jk.records[idx] = newRecord;

    document.getElementById('save-btn').classList.remove('edit-mode');

function jk_editItem(date) {
    const r = D_jk.records.find(r => r.date === date);

    document.getElementById('targetDate').value  = r.date;
    document.getElementById('sober').value       = r.sober;

    document.getElementById('reason').value      = r.sober === 'X' ? (r.reason || '') : '';

function jk_deleteRecord(date) {

function autoCalcLoanPayment() {
    const type         = document.getElementById('loan-repay-type').value;
    const balance      = parseInt(document.getElementById('loan-balance').value)  || 0;
    const rate         = parseFloat(document.getElementById('loan-rate').value)   || 0;
    const graceDateVal = document.getElementById('loan-grace-date').value;
    const endDateVal   = document.getElementById('loan-end-date').value;
    const preview      = document.getElementById('loan-calc-preview');
    const body         = document.getElementById('loan-preview-body');

    // 마이너스 통장: 날짜 불필요, 잔액+금리만 있으면 미리보기
    if (type === 'overdraft') {
        if (!balance || !rate) { preview.style.display = 'none'; return; }
        const r = rate / 100 / 12;
        const monthlyInt = Math.round(balance * r);
        document.getElementById('loan-monthly').value = monthlyInt;
        body.innerHTML = `
            <div class="loan-preview-row">
                <span class="loan-preview-label">월 이자 납부액 (현 잔액 기준)</span>
                <span class="loan-preview-val red">${fmtMoney(monthlyInt)}</span>
            </div>
            <div class="loan-preview-row">
                <span class="loan-preview-label">연간 이자 합계 (잔액 불변 시)</span>
                <span class="loan-preview-val red">${fmtMoney(monthlyInt * 12)}</span>
            </div>`;
        preview.style.display = 'block';
        return;
    }

    if (!balance || !rate || !endDateVal || !type) { preview.style.display = 'none'; return; }

    const today     = new Date(); today.setHours(0,0,0,0);
    const graceDate = graceDateVal ? new Date(graceDateVal) : null;
    const endDate   = new Date(endDateVal);
    const grace     = graceDate ? monthDiff(today, graceDate) : 0;
    const refDate   = (graceDate && grace > 0) ? graceDate : today;
    const months    = monthDiff(refDate, endDate);

    if (months <= 0) { preview.style.display = 'none'; return; }

    const r = rate / 100 / 12;
    const graceInterest = Math.round(balance * r);
    let rows = '';
    let repMonthly = 0;

    if (grace > 0) {
        rows += `<div class="loan-preview-row">
            <span class="loan-preview-label">거치기한 월 납부액 (이자만, ${grace}개월)</span>
            <span class="loan-preview-val red">${fmtMoney(graceInterest)}</span>
        </div>`;
    }

    if (type === 'annuity') {
        repMonthly = r === 0
            ? Math.round(balance / months)
            : Math.round(balance * (r * Math.pow(1+r, months)) / (Math.pow(1+r, months) - 1));
        const firstInt  = Math.round(balance * r);
        const firstPrin = repMonthly - firstInt;
        const totalInt  = repMonthly * months - balance + (grace > 0 ? graceInterest * grace : 0);
        rows += `<div class="loan-preview-row">
            <span class="loan-preview-label">대출기한 월 납부액 (고정, ${months}개월)</span>
            <span class="loan-preview-val">${fmtMoney(repMonthly)}</span>
        </div>
        <div class="loan-preview-row">
            <span class="loan-preview-label">└ 첫 달 원금 / 이자</span>
            <span class="loan-preview-sub">${fmtMoney(firstPrin)} / <span style="color:#e53e3e">${fmtMoney(firstInt)}</span></span>
        </div>
        <div class="loan-preview-row">
            <span class="loan-preview-label">총 납부 이자 합계</span>
            <span class="loan-preview-val red">${fmtMoney(Math.max(0, totalInt))}</span>
        </div>`;
    } else if (type === 'principal_equal') {
        const prin1     = Math.round(balance / months);
        const int1      = Math.round(balance * r);
        const intLast   = Math.round(prin1 * r);
        repMonthly      = prin1 + int1;
        const totalInt  = Math.round(r * (balance * months - prin1 * months * (months - 1) / 2))
                          + (grace > 0 ? graceInterest * grace : 0);
        rows += `<div class="loan-preview-row">
            <span class="loan-preview-label">대출기한 첫 달 납부액</span>
            <span class="loan-preview-val">${fmtMoney(repMonthly)}</span>
        </div>
        <div class="loan-preview-row">
            <span class="loan-preview-label">└ 매달 원금 / 첫 달 이자</span>
            <span class="loan-preview-sub">${fmtMoney(prin1)} / <span style="color:#e53e3e">${fmtMoney(int1)}</span></span>
        </div>
        <div class="loan-preview-row">
            <span class="loan-preview-label">마지막 달 납부액 (약)</span>
            <span class="loan-preview-val">${fmtMoney(prin1 + intLast)}</span>
        </div>
        <div class="loan-preview-row">
            <span class="loan-preview-label">총 납부 이자 합계</span>
            <span class="loan-preview-val red">${fmtMoney(Math.max(0, totalInt))}</span>
        </div>`;
    }

    document.getElementById('loan-monthly').value = repMonthly;
    body.innerHTML = rows;
    preview.style.display = 'block';
}

function calcRepaymentSchedule(loan) {
    if (!loan.repaymentType || loan.interestRate == null || !loan.remainingBalance) return null;

    const today = new Date(); today.setHours(0,0,0,0);
    const payDay = loan.paymentDay || 1;
    let payDate  = new Date(today.getFullYear(), today.getMonth(), payDay);
    if (payDate < today) payDate = new Date(today.getFullYear(), today.getMonth() + 1, payDay);

    // 마이너스 통장: 현 잔액 기준 12개월 이자만 예측
    if (loan.repaymentType === 'overdraft') {
        const r = loan.interestRate / 100 / 12;
        const interest = Math.round(loan.remainingBalance * r);
        return Array.from({ length: 12 }, (_, i) => {
            const d = new Date(payDate.getFullYear(), payDate.getMonth() + i, payDay);
            return {
                month: i + 1,
                date: `${d.getFullYear()}.${pad(d.getMonth() + 1)}`,
                principal: 0, interest,
                payment: interest,
                balance: loan.remainingBalance,
                isGrace: false, isOverdraft: true
            };
        });
    }

    // 날짜 기반으로 동적 계산 (저장된 날짜 우선)
    let grace, n;
    if (loan.loanEndDate) {
        const graceDate = loan.gracePeriodEndDate ? new Date(loan.gracePeriodEndDate) : null;
        const endDate   = new Date(loan.loanEndDate);
        grace           = graceDate ? monthDiff(today, graceDate) : 0;
        const refDate   = (graceDate && grace > 0) ? graceDate : today;
        n               = monthDiff(refDate, endDate);
    } else {
        grace = loan.gracePeriod || 0;
        n     = loan.remainingMonths;
    }
    if (!n) return null;

    const r     = loan.interestRate / 100 / 12;
    let balance = loan.remainingBalance;
    const schedule = [];

    // 거치기한: 이자만 납부
    for (let i = 0; i < grace; i++) {
        const interest = Math.round(balance * r);
        schedule.push({
            month: i + 1,
            date: `${payDate.getFullYear()}.${pad(payDate.getMonth() + 1)}`,
            principal: 0, interest,
            payment: interest, balance,
            isGrace: true
        });
        payDate = new Date(payDate.getFullYear(), payDate.getMonth() + 1, payDay);
    }

    // 대출기한
    let fixedPayment = 0;
    if (loan.repaymentType === 'annuity') {
        fixedPayment = r === 0
            ? Math.round(balance / n)
            : Math.round(balance * (r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1));
    }

    for (let i = 0; i < n && balance > 0; i++) {
        const interest = Math.round(balance * r);
        let principal;
        if (loan.repaymentType === 'principal_equal') {
            const base = Math.round(loan.remainingBalance / n);
            principal  = (i === n - 1) ? balance : Math.min(base, balance);
        } else {
            principal = (i === n - 1) ? balance : Math.max(0, fixedPayment - interest);
        }
        balance = Math.max(0, balance - principal);
        schedule.push({
            month: grace + i + 1,
            date: `${payDate.getFullYear()}.${pad(payDate.getMonth() + 1)}`,
            principal, interest,
            payment: principal + interest, balance,
            isGrace: false
        });
        payDate = new Date(payDate.getFullYear(), payDate.getMonth() + 1, payDay);
    }
    return schedule;
}

function calcPaymentsThisMonth(loan) {
    const now = new Date();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
    const full = calcRepaymentSchedule(loan);
    if (!full) return { payments: [], totalInterest: 0 };
    const payDay = loan.paymentDay || 1;
    const payments = full.filter(item => {
        const [y, m] = item.date.split('.').map(Number);
        const d = new Date(y, m - 1, payDay);
        return d >= monthStart && d <= monthEnd;
    });
    const totalInterest = payments.reduce((s, p) => s + p.interest, 0);
    return { payments, totalInterest };
}


function getLoanNextPayDate(loan) {
    if (!loan.paymentDay) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    let d = new Date(today.getFullYear(), today.getMonth(), loan.paymentDay);
    if (d < today) d = new Date(today.getFullYear(), today.getMonth() + 1, loan.paymentDay);
    return d;
}

    }

    const today2 = new Date(); today2.setHours(0,0,0,0);

    // 이번달 납부 예정 카드
    if (scheduleCardEl && scheduleListEl) {
        const nowForPastDue = new Date(); nowForPastDue.setHours(0,0,0,0);
        const allItems = loans.flatMap(loan => {
            const { payments } = calcPaymentsThisMonth(loan);
            const completedMap = {};
            (loan.completedSchedule || []).forEach(c => { completedMap[c.date] = c.actualAmount; });
            const payDay = loan.paymentDay || 1;
            // 지난 납부일은 미확인이어도 납부 완료로 간주(연체 처리 안 함)
            const futureItems = payments
                .map(m => {
                    const [y, mo] = m.date.split('.').map(Number);
                    const d = new Date(y, mo - 1, payDay);
                    const isDone = m.date in completedMap;
                    return { loanId: loan.id, loanName: loan.name, rawDate: m.date, date: d, payment: m.payment, interest: m.interest, principal: m.principal, isGrace: m.isGrace, isOverdraft: m.isOverdraft, isDone, isPastDue: false, actualAmount: completedMap[m.date] };
                })
                .filter(it => it.isDone || it.date >= nowForPastDue);
            const combined = [...futureItems].sort((a, b) => a.date - b.date);
            return combined;
        }).sort((a, b) => a.date - b.date);

        if (allItems.length > 0) {
            const nowM = new Date(); document.getElementById('loan-schedule-card-title').textContent = `${nowM.getMonth()+1}월 납부 예정`;

                if (it.isDone) {
                    return `<div class="list-item" style="opacity:0.8"><div class="info"><div class="name">✅ ${escHtml(it.loanName)}</div><div class="sub">${dateStr} · ${breakdown} → 실제 ${fmtMoney(it.actualAmount)}</div></div><div class="right"><button class="btn-sm-unconfirm" onclick="loanNoticeUnconfirm('${it.loanId}','${it.rawDate}',${it.principal},${it.actualAmount})">확인취소</button></div></div>`;
                }
                return `<div class="list-item"><div class="info"><div class="name">${escHtml(it.loanName)}${pastDueBadge}</div><div class="sub">${dateStr} · ${breakdown} · <strong>−${fmtMoney(it.payment)}</strong></div></div><div class="right" style="flex-shrink:0;"><button class="btn-sm-confirm" onclick="loanNoticeComplete('${it.loanId}','${it.rawDate}',${it.principal},${it.payment})">납부완료</button><button class="btn-sm-edit" onclick="editLoan('${it.loanId}')">수정</button><button class="btn-sm" onclick="deleteLoan('${it.loanId}')">삭제</button></div></div>`;
            }).join('');
            const pendingTotal = allItems.filter(it => !it.isDone).reduce((s, it) => s + it.payment, 0);

            } else {

            }
            scheduleCardEl.style.display = 'block';
        } else {
            scheduleCardEl.style.display = 'none';
        }
    }

        const nextClass = isSoon ? 'loan-next-pay' : 'loan-next-pay far';

        // 상환 방식 뱃지
        const repayLabel = loan.repaymentType === 'annuity'         ? '원리금균등'

}

function addLoan() {
    const name             = document.getElementById('loan-name').value.trim();
    const remainingBalance = parseInt(document.getElementById('loan-balance').value) || 0;
    const interestRate     = parseFloat(document.getElementById('loan-rate').value) || null;
    const repaymentType    = document.getElementById('loan-repay-type').value || null;
    const gracePeriodEndDate = document.getElementById('loan-grace-date').value || null;
    const loanEndDate        = document.getElementById('loan-end-date').value || null;
    const _today = new Date(); _today.setHours(0,0,0,0);
    const _graceDate = gracePeriodEndDate ? new Date(gracePeriodEndDate) : null;
    const _endDate   = loanEndDate ? new Date(loanEndDate) : null;
    const gracePeriod     = _graceDate ? monthDiff(_today, _graceDate) : 0;
    const _refDate        = (_graceDate && gracePeriod > 0) ? _graceDate : _today;
    const remainingMonths = _endDate ? monthDiff(_refDate, _endDate) : null;
    const monthlyPayment   = parseInt(document.getElementById('loan-monthly').value) || 0;
    const paymentDay       = parseInt(document.getElementById('loan-payday').value) || null;
    const creditLimit      = parseInt(document.getElementById('loan-limit').value) || null;
    const memo             = document.getElementById('loan-memo').value.trim();
    if (!name) { alert('대출명을 입력해 주세요.'); return; }

    if (!D.loans) D.loans = [];

    if (_editingLoanId) {
        const idx = D.loans.findIndex(x => x.id === _editingLoanId);
        if (idx >= 0) D.loans[idx] = { ...D.loans[idx], name, remainingBalance, interestRate, repaymentType, gracePeriod, gracePeriodEndDate, remainingMonths, loanEndDate, monthlyPayment, paymentDay, creditLimit, memo };
        _editingLoanId = null;
        const btn = document.getElementById('loan-submit-btn');
        btn.textContent = '+ 대출 추가';
        btn.style.background = '';
        document.getElementById('loan-form-title').textContent = '대출 추가';
    } else {
        D.loans.push({ id: uid(), name, remainingBalance, interestRate, repaymentType, gracePeriod, gracePeriodEndDate, remainingMonths, loanEndDate, monthlyPayment, paymentDay, creditLimit, memo });
    }

    save();
    ['loan-name','loan-balance','loan-rate','loan-payday','loan-memo','loan-grace-date','loan-end-date'].forEach(id => {
        document.getElementById(id).value = '';
    });
    document.getElementById('loan-repay-type').value = '';
    document.getElementById('loan-monthly').value = '';
    document.getElementById('loan-calc-preview').style.display = 'none';
    document.getElementById('loan-limit').value = '';
    document.getElementById('loan-payday-od').value = '';
    loanRepayTypeChange(); // 필드 표시 상태 초기화
    renderLoans();
}

function editLoan(id) {
    const loan = (D.loans || []).find(x => x.id === id);
    if (!loan) return;
    _editingLoanId = id;
    document.getElementById('loan-name').value       = loan.name;
    document.getElementById('loan-balance').value    = loan.remainingBalance || '';
    document.getElementById('loan-rate').value       = loan.interestRate != null ? loan.interestRate : '';
    document.getElementById('loan-repay-type').value = loan.repaymentType || '';
    document.getElementById('loan-payday').value     = loan.paymentDay || '';
    document.getElementById('loan-memo').value       = loan.memo || '';
    document.getElementById('loan-limit').value      = loan.creditLimit || '';
    if (loan.repaymentType === 'overdraft') {
        document.getElementById('loan-payday-od').value = loan.paymentDay || '';
    }
    loanRepayTypeChange(); // 필드 표시 상태 복원

        const d = new Date();
        d.setMonth(d.getMonth() + loan.gracePeriod);
        document.getElementById('loan-grace-date').value = fmtDate(d);
    } else {
        document.getElementById('loan-grace-date').value = '';
    }

    autoCalcLoanPayment();

    document.getElementById('loan-form-title').textContent = '대출 수정';

    // 폼 카드 상단으로 정확히 스크롤
    const formCard = document.getElementById('loan-form-title').closest('.card');
    const navH = document.querySelector('.main-nav')?.offsetHeight || 60;
    window.scrollTo({ top: formCard.getBoundingClientRect().top + window.scrollY - navH - 12, behavior: 'smooth' });
}

function deleteLoan(id) {
    if (!confirm('정말 삭제하시겠습니까?')) return;
    D.loans = (D.loans || []).filter(x => x.id !== id);
    save(); renderLoans();
}

function loanNoticeUnconfirm(id, date, principal, actualAmount) {
    const loan = (D.loans || []).find(x => x.id === id);
    if (!loan) return;
    if (!confirm(`납부 완료를 취소하시겠습니까?\n실제 납부액 ${fmtMoney(actualAmount)}이 복원됩니다.${principal > 0 ? `\n원금 ${fmtMoney(principal)}이 잔여 대출금에 다시 추가됩니다.` : ''}`)) return;
    // 연동된 지출 항목 제거
    const entry = (loan.completedSchedule || []).find(c => c.date === date);
    if (entry && entry.spendingLogId) {
        D.spendingLog = (D.spendingLog || []).filter(x => x.id !== entry.spendingLogId);
    }
    loan.completedSchedule = (loan.completedSchedule || []).filter(c => c.date !== date);
    if (principal > 0) {
        loan.remainingBalance = (loan.remainingBalance || 0) + principal;
    }
    save(); renderLoans();
}

function loanNoticeComplete(id, date, principal, expectedAmount) {
    const loan = (D.loans || []).find(x => x.id === id);
    if (!loan) return;
    const input = prompt(`실제 납부액을 입력하세요 (예정: ${expectedAmount.toLocaleString()}원)`, expectedAmount);
    if (input === null) return;
    const actualAmount = parseInt(input) || 0;
    if (!actualAmount || actualAmount <= 0) { alert('실제 납부액을 입력해 주세요.'); return; }
    const msg = principal > 0
        ? `납부 완료 처리합니다.\n실제 납부액: ${fmtMoney(actualAmount)}\n원금 ${fmtMoney(principal)}원이 잔여 대출금에서 차감됩니다.`
        : `이자 납부 완료 처리합니다.\n실제 납부액: ${fmtMoney(actualAmount)}`;
    if (!confirm(msg)) return;
    if (!loan.completedSchedule) loan.completedSchedule = [];
    loan.completedSchedule = loan.completedSchedule.filter(c => c.date !== date);
    loan.completedSchedule.push({ date, actualAmount });
    if (principal > 0) {
        loan.remainingBalance = Math.max(0, (loan.remainingBalance || 0) - principal);
    }
    save(); renderLoans();
}


// ── 구독 관리 ──
function subCycleChange() {
    const cycle = document.getElementById('sub-cycle').value;
    document.getElementById('sub-billing-day-wrap').style.display  = cycle === 'monthly' ? '' : 'none';
    document.getElementById('sub-billing-date-wrap').style.display = cycle === 'yearly'  ? '' : 'none';
}

function getNextBillingDate(sub) {
    const today = new Date(); today.setHours(0,0,0,0);
    if (sub.cycle === 'monthly') {
        const day = sub.billingDay || 1;
        let d = new Date(today.getFullYear(), today.getMonth(), day);
        if (d < today) d = new Date(today.getFullYear(), today.getMonth() + 1, day);
        return d;
    } else {
        const ref = new Date(sub.billingDate);
        let d = new Date(today.getFullYear(), ref.getMonth(), ref.getDate());
        if (d < today) d = new Date(today.getFullYear() + 1, ref.getMonth(), ref.getDate());
        return d;
    }
}

function renderSubscriptions() {
    const subs = D.subscriptions || [];
    const el = document.getElementById('sub-list');
    const scheduleCardEl = document.getElementById('sub-schedule-card');
    const scheduleListEl = document.getElementById('sub-schedule-list');

    if (subs.length === 0) {
        el.innerHTML = '<div class="empty">등록된 구독 서비스가 없습니다</div>';
        if (scheduleCardEl) scheduleCardEl.style.display = 'none';
        return;
    }

    const today = new Date(); today.setHours(0,0,0,0);
    const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
    const monthEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0, 23, 59, 59, 999);

    // 이번달 결제 예정 카드
    if (scheduleCardEl && scheduleListEl) {
        document.getElementById('sub-schedule-card-title').textContent = `${new Date().getMonth()+1}월 결제 예정`;
        const allItems = [];
        subs.filter(s => s.active).forEach(sub => {
            const completedMap = {};
            (sub.completedPayments || []).forEach(c => { completedMap[c.date] = c; });
            if (sub.cycle === 'monthly' && sub.billingDay) {
                const d = new Date(today.getFullYear(), today.getMonth(), sub.billingDay);
                if (d >= monthStart && d <= monthEnd) {
                    const dateStr = fmtDate(d);
                    const isDone = dateStr in completedMap;
                    const actualAmount = isDone ? completedMap[dateStr].actualAmount : null;
                    allItems.push({ sub, dateStr, isDone, actualAmount, date: new Date(d) });
                }
            } else if (sub.cycle === 'yearly' && sub.billingDate) {
                const ref = new Date(sub.billingDate);
                const d = new Date(today.getFullYear(), ref.getMonth(), ref.getDate());
                if (d >= monthStart && d <= monthEnd) {
                    const dateStr = fmtDate(d);
                    const isDone = dateStr in completedMap;
                    const actualAmount = isDone ? completedMap[dateStr].actualAmount : null;
                    allItems.push({ sub, dateStr, isDone, actualAmount, date: d });
                }
            }
        });
        allItems.sort((a, b) => a.date - b.date);
        if (allItems.length === 0) {
            scheduleCardEl.style.display = 'none';
        } else {
            scheduleCardEl.style.display = '';
            scheduleListEl.innerHTML = allItems.map(it => {
                if (it.isDone) {
                    return `<div class="list-item" style="opacity:0.8"><div class="info"><div class="name">✅ ${escHtml(it.sub.name)}</div><div class="sub">${it.dateStr} → 실제 ${fmtMoney(it.actualAmount)}</div></div><div class="right"><button class="btn-sm-unconfirm" onclick="subPayUnconfirm('${it.sub.id}','${it.dateStr}',${it.actualAmount})">확인취소</button></div></div>`;
                } else {
                    return `<div class="list-item"><div class="info"><div class="name">${escHtml(it.sub.name)}</div><div class="sub">${it.dateStr} · ${fmtMoney(it.sub.amount)}</div></div><div class="right"><span class="amount">−${fmtMoney(it.sub.amount)}</span><button class="btn-sm-confirm" onclick="subPayComplete('${it.sub.id}','${it.dateStr}',${it.sub.amount})">지출완료</button><button class="btn-sm-edit" onclick="editSubscription('${it.sub.id}')">수정</button><button class="btn-sm" onclick="deleteSubscription('${it.sub.id}')">삭제</button></div></div>`;
                }
            }).join('');
            const pendingTotal = allItems.filter(it => !it.isDone).reduce((s, it) => s + it.sub.amount, 0);
            const totalWrap = document.getElementById('sub-schedule-total-wrap');
            if (pendingTotal > 0) {
                document.getElementById('sub-schedule-total').textContent = fmtMoney(pendingTotal);
                totalWrap.style.display = 'flex';
            } else {
                totalWrap.style.display = 'none';
            }
        }
    }

    const sorted = [...subs].sort((a, b) => {
        if (a.active !== b.active) return a.active ? -1 : 1;
        return getNextBillingDate(a) - getNextBillingDate(b);
    });

    el.innerHTML = sorted.map(sub => {
        const nextDate  = getNextBillingDate(sub);
        const daysLeft  = Math.ceil((nextDate - today) / 86400000);
        const isSoon    = daysLeft <= 7 && sub.active;
        const nextStr   = fmtDate(nextDate);
        const cycleBadge = sub.cycle === 'monthly' ? 'sub-badge-monthly' : 'sub-badge-yearly';
        const cycleLabel = sub.cycle === 'monthly' ? '매월' : '매년';
        const itemClass  = sub.active ? '' : 'sub-inactive';
        const dateClass  = isSoon ? 'sub-next-date soon' : 'sub-next-date';
        const daysText   = isSoon ? ` · ${daysLeft === 0 ? '오늘' : `${daysLeft}일 후`}` : '';

        return `<div class="list-item ${itemClass}">
            <div class="sub-item-inner">
                <label class="sub-toggle" title="${sub.active ? '비활성화' : '활성화'}">
                    <input type="checkbox" ${sub.active ? 'checked' : ''} onchange="toggleSubscription('${sub.id}')">
                    <span class="sub-toggle-slider"></span>
                </label>
                <div class="info" style="min-width:0;">
                    <div class="name">${escHtml(sub.name)}<span class="sub-badge ${cycleBadge}">${cycleLabel}</span></div>
                    <div class="${dateClass}">${nextStr}${daysText} · ${fmtMoney(sub.amount)}</div>
                </div>
            </div>
            <div class="right" style="flex-shrink:0;">
                <button class="btn-sm-edit" onclick="editSubscription('${sub.id}')">수정</button>
                <button class="btn-sm" onclick="deleteSubscription('${sub.id}')">삭제</button>
            </div>
        </div>`;
    }).join('');
}

function addSubscription() {
    const name  = document.getElementById('sub-name').value.trim();
    const cycle = document.getElementById('sub-cycle').value;
    const amount   = parseInt(document.getElementById('sub-amount').value);
    if (!name || !amount || amount <= 0) { alert('서비스명과 금액을 입력해 주세요.'); return; }

    let billingDay = null, billingDate = null;
    if (cycle === 'monthly') {
        billingDay = parseInt(document.getElementById('sub-billing-day').value);
        if (!billingDay || billingDay < 1 || billingDay > 31) { alert('결제일을 1~31 사이로 입력해 주세요.'); return; }
    } else {
        billingDate = document.getElementById('sub-billing-date').value;
        if (!billingDate) { alert('연간 결제 기준일을 입력해 주세요.'); return; }
    }

    if (!D.subscriptions) D.subscriptions = [];

    if (_editingSubId) {
        const idx = D.subscriptions.findIndex(x => x.id === _editingSubId);
        if (idx >= 0) D.subscriptions[idx] = { ...D.subscriptions[idx], name, cycle, amount, billingDay, billingDate };
        _editingSubId = null;
        const btn = document.getElementById('sub-submit-btn');
        btn.textContent = '+ 구독 추가';
        btn.style.background = '';
        document.getElementById('sub-form-title').textContent = '구독 서비스 추가';
    } else {
        D.subscriptions.push({ id: uid(), name, cycle, amount, billingDay, billingDate, active: true });
    }

    save();
    document.getElementById('sub-name').value = '';
    document.getElementById('sub-amount').value = '';
    document.getElementById('sub-billing-day').value = '';
    document.getElementById('sub-billing-date').value = '';
    renderSubscriptions();
}

function editSubscription(id) {
    const sub = (D.subscriptions || []).find(x => x.id === id);
    if (!sub) return;
    _editingSubId = id;
    document.getElementById('sub-name').value  = sub.name;
    document.getElementById('sub-cycle').value = sub.cycle;
    document.getElementById('sub-amount').value   = sub.amount;
    subCycleChange();
    if (sub.cycle === 'monthly') {
        document.getElementById('sub-billing-day').value = sub.billingDay || '';
    } else {
        document.getElementById('sub-billing-date').value = sub.billingDate || '';
    }
    const btn = document.getElementById('sub-submit-btn');
    btn.textContent = '✏️ 수정 완료';
    btn.style.background = '#f6ad55';
    document.getElementById('sub-form-title').textContent = '구독 서비스 수정';
    document.getElementById('tab-subscription').scrollIntoView({ behavior: 'smooth' });
}

function deleteSubscription(id) {
    if (!confirm('정말 삭제하시겠습니까?')) return;
    D.subscriptions = (D.subscriptions || []).filter(x => x.id !== id);
    save(); renderSubscriptions();
}

function toggleSubscription(id) {
    const sub = (D.subscriptions || []).find(x => x.id === id);
    if (!sub) return;
    sub.active = !sub.active;
    save(); renderSubscriptions();
}

function subPayComplete(id, dateStr, expectedAmount) {
    const sub = (D.subscriptions || []).find(x => x.id === id);
    if (!sub) return;
    const input = prompt(`실제 결제금액을 입력하세요 (예정: ${expectedAmount.toLocaleString()}원)`, expectedAmount);
    if (input === null) return;
    const actualAmount = parseInt(input) || 0;
    if (!actualAmount || actualAmount <= 0) { alert('실제 결제금액을 입력해 주세요.'); return; }
    if (!confirm(`지출 완료 처리합니다.\n${sub.name} · ${dateStr}\n실제 결제금액: ${fmtMoney(actualAmount)}`)) return;
    if (!sub.completedPayments) sub.completedPayments = [];
    sub.completedPayments = sub.completedPayments.filter(c => c.date !== dateStr);
    sub.completedPayments.push({ date: dateStr, actualAmount });
    save(); renderSubscriptions();
}

function subPayUnconfirm(id, dateStr, actualAmount) {
    const sub = (D.subscriptions || []).find(x => x.id === id);
    if (!sub) return;
    if (!confirm(`지출 완료를 취소하시겠습니까?\n${sub.name} · ${dateStr}`)) return;
    const entry = (sub.completedPayments || []).find(c => c.date === dateStr);
    if (entry && entry.spendingLogId) {
        D.spendingLog = (D.spendingLog || []).filter(x => x.id !== entry.spendingLogId);
    }
    sub.completedPayments = (sub.completedPayments || []).filter(c => c.date !== dateStr);
    save(); renderSubscriptions();
}

// ── 생활비 ──
const LV_DEFAULT_CATS = ['식비', '카페·간식', '교통', '생활용품', '쇼핑', '기타'];
let lv_catEditing = false;
function lvCats() {
    if (!Array.isArray(D.livingCats) || D.livingCats.length === 0) D.livingCats = [...LV_DEFAULT_CATS];
    return D.livingCats;
}
let lv_viewMonth = '';
let lv_category  = '식비';
let _editingLivingId = null;

function lvMonthKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }

// 이번 달 고정 지출(구독·대출) 합계 — 생활비 목표와는 별도
function calcFixedThisMonth() {
    const today = new Date();
    const y = today.getFullYear(), m = today.getMonth();
    let sub = 0;
    (D.subscriptions || []).filter(x => x.active).forEach(x => {
        if (x.cycle === 'monthly') sub += x.amount || 0;
        else if (x.billingDate && new Date(x.billingDate).getMonth() === m) sub += x.amount || 0;
    });
    let loan = 0;
    (D.loans || []).forEach(l => {
        calcPaymentsThisMonth(l).payments.forEach(p => { loan += p.payment || 0; });
    });
    return { sub, loan, total: sub + loan };
}

function renderLvCats() {
    const cats = lvCats();
    if (!cats.includes(lv_category) && !_editingLivingId) lv_category = cats[0];
    const el = document.getElementById('lv-cats');
    el.classList.toggle('editing', lv_catEditing);
    const toggle = document.getElementById('lv-cat-edit-toggle');
    toggle.textContent = lv_catEditing ? '✓ 편집 완료' : '⚙️ 분류 편집';
    toggle.classList.toggle('on', lv_catEditing);
    document.getElementById('lv-cat-hint').style.display = lv_catEditing ? '' : 'none';
    if (lv_catEditing) {
        el.innerHTML = cats.map((c, i) =>
            `<span class="lv-cat"><button type="button" class="lv-cat-rename" onclick="lvRenameCat(${i})">${escHtml(c)}</button><button type="button" class="lv-cat-x" onclick="lvDeleteCat(${i})" aria-label="삭제">✕</button></span>`
        ).join('') + `<button type="button" class="lv-cat lv-cat-add" onclick="lvAddCat()">+ 추가</button>`;
    } else {
        el.innerHTML = cats.map((c, i) =>
            `<button type="button" class="lv-cat${c === lv_category ? ' active' : ''}" onclick="lvPickCat(${i})">${escHtml(c)}</button>`
        ).join('');
    }
}
function lvPickCat(i) { lv_category = lvCats()[i]; renderLvCats(); }
function lvToggleCatEdit() { lv_catEditing = !lv_catEditing; renderLvCats(); }

function lvAskCatName(msg, cur) {
    const input = prompt(msg, cur || '');
    if (input === null) return null;
    const name = input.trim();
    if (!name) { alert('이름을 입력해 주세요.'); return null; }
    if (name.length > 12) { alert('12자 이내로 입력해 주세요.'); return null; }
    if (lvCats().includes(name) && name !== cur) { alert('이미 있는 분류예요.'); return null; }
    return name;
}
function lvAddCat() {
    const name = lvAskCatName('새 분류 이름을 입력하세요');
    if (!name) return;
    lvCats().push(name);
    save(); renderLvCats();
}
function lvRenameCat(i) {
    const cats = lvCats(); const old = cats[i];
    const name = lvAskCatName(`'${old}' 분류의 새 이름을 입력하세요`, old);
    if (!name || name === old) return;
    cats[i] = name;
    // 기존 기록의 분류 이름도 함께 변경
    (D.livingLog || []).forEach(x => { if (x.category === old) x.category = name; });
    if (lv_category === old) lv_category = name;
    save(); renderLvCats(); renderLiving();
}
function lvDeleteCat(i) {
    const cats = lvCats();
    if (cats.length <= 1) { alert('분류는 최소 1개는 있어야 해요.'); return; }
    const name = cats[i];
    const used = (D.livingLog || []).filter(x => x.category === name).length;
    const msg = used
        ? `'${name}' 분류를 삭제할까요?\n이 분류로 기록된 ${used}건은 그대로 남아요.`
        : `'${name}' 분류를 삭제할까요?`;
    if (!confirm(msg)) return;
    cats.splice(i, 1);
    if (lv_category === name) lv_category = cats[0];
    save(); renderLvCats();
}

function lvPrevMonth() {
    const [y, m] = lv_viewMonth.split('-').map(Number);
    lv_viewMonth = lvMonthKey(new Date(y, m - 2, 1));
    renderLiving();
}
function lvNextMonth() {
    const [y, m] = lv_viewMonth.split('-').map(Number);
    const next = lvMonthKey(new Date(y, m, 1));
    if (next > lvMonthKey(new Date())) return;
    lv_viewMonth = next;
    renderLiving();
}

function lvEditGoal() {
    const cur = D.livingGoal || 1000000;
    const input = prompt('한 달 생활비 목표를 입력하세요 (원)', cur);
    if (input === null) return;
    const v = parseInt(String(input).replace(/[^0-9]/g, ''));
    if (!v || v <= 0) { alert('올바른 금액을 입력해 주세요.'); return; }
    D.livingGoal = v;
    save(); renderLiving();
}

function renderLiving() {
    if (!lv_viewMonth) lv_viewMonth = lvMonthKey(new Date());
    const goal  = D.livingGoal || 1000000;
    const [vy, vm] = lv_viewMonth.split('-').map(Number);
    const now   = new Date();
    const thisMonth = lvMonthKey(now);
    const isCurrent = lv_viewMonth === thisMonth;
    const daysInMonth = new Date(vy, vm, 0).getDate();
    const items = (D.livingLog || []).filter(x => x.date.startsWith(lv_viewMonth));
    const spent = items.reduce((s, x) => s + x.amount, 0);
    const remain = goal - spent;
    const pct = goal ? spent / goal * 100 : 0;

    document.getElementById('lv-month-title').textContent = `${vy}년 ${vm}월`;
    document.getElementById('lv-next-btn').disabled = isCurrent;
    document.getElementById('lv-goal-text').textContent = fmtMoney(goal);
    document.getElementById('lv-spent').innerHTML = `${fmtMoney(spent)}<small>/ ${fmtMoney(goal)}</small>`;

    const fill = document.getElementById('lv-bar-fill');
    fill.style.width = Math.min(100, pct) + '%';
    fill.style.background = pct > 100 ? '#fc8181' : pct >= 80 ? '#f6e05e' : '#68d391';
    document.getElementById('lv-percent').textContent = `${Math.round(pct)}% 사용`;

    const paceEl = document.getElementById('lv-bar-pace');
    const statusEl = document.getElementById('lv-status');
    const set = (i, label, value) => {
        document.getElementById(`lv-stat${i}-label`).textContent = label;
        document.getElementById(`lv-stat${i}`).textContent = value;
    };

    if (isCurrent) {
        const day = now.getDate();
        const daysLeft = daysInMonth - day + 1; // 오늘 포함
        const pace = goal * day / daysInMonth;  // 오늘까지 써도 되는 금액
        const todaySpent = items.filter(x => x.date === todayStr()).reduce((s, x) => s + x.amount, 0);
        const spentBeforeToday = spent - todaySpent;
        const dailyAllow = Math.max(0, Math.floor((goal - spentBeforeToday) / daysLeft));
        paceEl.style.display = '';
        paceEl.style.left = Math.min(100, day / daysInMonth * 100) + '%';
        document.getElementById('lv-pace-legend').textContent = `| 오늘까지 적정 ${fmtMoney(pace)}`;

        if (remain < 0) {
            statusEl.textContent = `🚨 목표를 ${fmtMoney(-remain)} 넘었어요. 남은 ${daysLeft}일은 최대한 아껴봐요!`;
        } else if (spent <= pace) {
            statusEl.textContent = `👍 순항 중! 적정 페이스보다 ${fmtMoney(pace - spent)} 덜 썼어요.`;
        } else {
            statusEl.textContent = `⚠️ 적정 페이스보다 ${fmtMoney(spent - pace)} 더 썼어요. 조금만 아껴봐요.`;
        }
        set(1, '남은 예산', remain < 0 ? `−${fmtMoney(-remain)}` : fmtMoney(remain));
        set(2, '오늘 가능액', fmtMoney(Math.max(0, dailyAllow - todaySpent)));
        set(3, '오늘 쓴 돈', fmtMoney(todaySpent));
    } else {
        paceEl.style.display = 'none';
        document.getElementById('lv-pace-legend').textContent = '';
        const usedDays = new Set(items.map(x => x.date)).size;
        statusEl.textContent = items.length === 0 ? '📭 이 달에는 기록이 없어요.'
            : remain >= 0 ? `🎉 목표 달성! ${fmtMoney(remain)} 아꼈어요.`
            : `😢 목표보다 ${fmtMoney(-remain)} 더 썼어요.`;
        set(1, remain >= 0 ? '아낀 돈' : '초과 금액', fmtMoney(Math.abs(remain)));
        set(2, '하루 평균', fmtMoney(spent / daysInMonth));
        set(3, '지출한 날', `${usedDays}일`);
    }

    // 고정 지출 안내 (이번 달만)
    const noteEl = document.getElementById('lv-fixed-note');
    const fixed = isCurrent ? calcFixedThisMonth() : null;
    if (fixed && fixed.total > 0) {
        noteEl.style.display = '';
        noteEl.innerHTML = `📌 이번 달 고정 지출 <strong>${fmtMoney(fixed.total)}</strong> (구독 ${fmtMoney(fixed.sub)} · 대출 ${fmtMoney(fixed.loan)})은 목표에서 제외돼요.`;
    } else {
        noteEl.style.display = 'none';
    }

    // 분류별
    const bdCard = document.getElementById('lv-breakdown-card');
    if (items.length) {
        const byCat = {};
        items.forEach(x => { const c = x.category || '기타'; byCat[c] = (byCat[c] || 0) + x.amount; });
        const max = Math.max(...Object.values(byCat));
        bdCard.style.display = '';
        document.getElementById('lv-breakdown').innerHTML = Object.entries(byCat)
            .sort((a, b) => b[1] - a[1])
            .map(([c, v]) => `<div class="lv-breakdown-row">
                <div class="lv-breakdown-head"><span>${escHtml(c)} <span style="color:#a0aec0;font-weight:400;">${Math.round(v / spent * 100)}%</span></span><span>${fmtMoney(v)}</span></div>
                <div class="lv-breakdown-bar"><div style="width:${v / max * 100}%"></div></div>
            </div>`).join('');
    } else {
        bdCard.style.display = 'none';
    }

    // 내역 (날짜별)
    document.getElementById('lv-list-title').textContent = isCurrent ? '이번 달 내역' : `${vm}월 내역`;
    const listEl = document.getElementById('lv-list');
    if (!items.length) { listEl.innerHTML = '<div class="empty">아직 기록이 없어요</div>'; return; }
    const byDate = {};
    items.forEach(x => { (byDate[x.date] = byDate[x.date] || []).push(x); });
    const WD = ['일','월','화','수','목','금','토'];
    listEl.innerHTML = Object.keys(byDate).sort().reverse().map(date => {
        const list = byDate[date];
        const d = new Date(date + 'T00:00:00');
        const sum = list.reduce((s, x) => s + x.amount, 0);
        return `<div class="lv-day-head"><span>${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})</span><span>${fmtMoney(sum)}</span></div>` +
            list.map(x => `<div class="list-item">
                <div class="info"><div class="name">${escHtml(x.memo || x.category || '생활비')}</div><div class="sub">${escHtml(x.category || '기타')}</div></div>
                <div class="right"><span class="amount">−${fmtMoney(x.amount)}</span>
                    <button class="btn-sm-edit" onclick="lvEdit('${x.id}')">수정</button>
                    <button class="btn-sm" onclick="lvDelete('${x.id}')">삭제</button></div>
            </div>`).join('');
    }).join('');
}

function lvResetForm() {
    _editingLivingId = null;
    document.getElementById('lv-amount').value = '';
    document.getElementById('lv-memo').value = '';
    document.getElementById('lv-form-title').textContent = '생활비 기록';
    const btn = document.getElementById('lv-submit-btn');
    btn.textContent = '+ 기록하기';
    btn.style.background = '';
}

function lvAdd() {
    const date   = document.getElementById('lv-date').value;
    const amount = parseInt(document.getElementById('lv-amount').value);
    const memo   = document.getElementById('lv-memo').value.trim();
    if (!date) { alert('날짜를 선택해 주세요.'); return; }
    if (!amount || amount <= 0) { alert('금액을 입력해 주세요.'); return; }
    if (!D.livingLog) D.livingLog = [];
    if (_editingLivingId) {
        const it = D.livingLog.find(x => x.id === _editingLivingId);
        if (it) Object.assign(it, { date, amount, memo, category: lv_category });
    } else {
        D.livingLog.push({ id: uid(), date, amount, memo, category: lv_category });
    }
    lv_viewMonth = date.slice(0, 7) > lvMonthKey(new Date()) ? lvMonthKey(new Date()) : date.slice(0, 7);
    lvResetForm();
    save(); renderLiving();
}

function lvEdit(id) {
    const it = (D.livingLog || []).find(x => x.id === id);
    if (!it) return;
    _editingLivingId = id;
    document.getElementById('lv-date').value   = it.date;
    document.getElementById('lv-amount').value = it.amount;
    document.getElementById('lv-memo').value   = it.memo || '';
    lv_category = it.category || '기타';
    renderLvCats();
    document.getElementById('lv-form-title').textContent = '생활비 수정';
    const btn = document.getElementById('lv-submit-btn');
    btn.textContent = '✏️ 수정 완료';
    btn.style.background = '#f6ad55';
    document.getElementById('lv-form-title').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function lvDelete(id) {
    if (!confirm('이 기록을 삭제할까요?')) return;
    D.livingLog = (D.livingLog || []).filter(x => x.id !== id);
    if (_editingLivingId === id) lvResetForm();
    save(); renderLiving();
}

// ── DOMContentLoaded ──
document.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('targetDate').value = todayStr();
    document.getElementById('lv-date').value    = todayStr();
    renderLvCats();

    await Promise.all([
        jk_load(),
        loadFromFirestore().then(() => {
            renderSubscriptions(); renderLoans(); renderLvCats(); renderLiving();
            ['lv-amount', 'lv-memo'].forEach(id => document.getElementById(id)
                .addEventListener('keydown', e => { if (e.key === 'Enter') lvAdd(); }));
        })
    ]);
});
